[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "wp-image-optimizer-cli"
version = "1.0.0"
description = "Bulk-optimize a WordPress uploads tree: WebP/AVIF conversion, safe resizing, server snippets and WP-CLI search-replace helpers."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Saizul Amin", email = "info@saizul.com" }]
keywords = ["wordpress", "webp", "avif", "image-optimization", "cli", "wp-cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Graphics :: Graphics Conversion",
]
dependencies = ["Pillow>=10.0", "rich>=13.0"]

[project.optional-dependencies]
avif = ["pillow-avif-plugin>=1.4"]
dev = ["pytest>=7.4", "ruff>=0.5"]

[project.urls]
Homepage = "https://saizul.com"
Source = "https://github.com/saizul/wp-image-optimizer-cli"

[project.scripts]
wp-imgopt = "wp_imgopt.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
